[workspace]
resolver = "3"
# crates/formats is a parent directory for filesystem-format parser crates
# (ntfs, fat, ext, …), not a crate itself. It cannot be handled with
# `exclude = ["crates/formats"]` — cargo's exclude is recursive and would
# silently drop every crate underneath it — so the first glob is narrowed
# to the fsmnt-* crates instead of a bare `crates/*`.
members = ["crates/fsmnt-*", "crates/formats/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
repository = "https://github.com/napbat/fsmnt"
# Inherited by the vendored crates under crates/formats/, which declare
# `authors.workspace = true` / `license.workspace = true`. Some of those
# crates derive from third-party work under the same dual license; their
# original copyright notices are preserved in THIRD-PARTY-NOTICES.md.
authors = ["Jon-Luke Biddle"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Internal crates
fsmnt-core = { path = "crates/fsmnt-core" }
fsmnt-device = { path = "crates/fsmnt-device" }
fsmnt-device-linux = { path = "crates/fsmnt-device-linux" }
fsmnt-device-macos = { path = "crates/fsmnt-device-macos" }
fsmnt-device-windows = { path = "crates/fsmnt-device-windows" }
fsmnt-dokan = { path = "crates/fsmnt-dokan" }
fsmnt-drivers = { path = "crates/fsmnt-drivers" }
fsmnt-fuse = { path = "crates/fsmnt-fuse" }
fsmnt-parser-core = { path = "crates/fsmnt-parser-core", default-features = false }
fsmnt-proxy = { path = "crates/fsmnt-proxy" }
fsmnt-testkit = { path = "crates/fsmnt-testkit" }
nostdio = { version = "0.2", default-features = false }

# Vendored filesystem-format crates (crates/formats/). Their manifests
# reference these entries with `<name> = { workspace = true }`.
# These parsers are no_std-capable and must stay that way: every entry
# takes `default-features = false` so nothing pulls `std` in implicitly.
# Consumers that need std (e.g. the fsmnt-drivers adapters, which bridge
# to std::io) opt in explicitly with `features = ["std"]`.
fs-ntfs = { path = "crates/formats/fs-ntfs", default-features = false }
fs-fat = { path = "crates/formats/fs-fat", default-features = false }
fs-apfs = { path = "crates/formats/fs-apfs", default-features = false }
fs-btrfs = { path = "crates/formats/fs-btrfs", default-features = false }
fs-exfat = { path = "crates/formats/fs-exfat", default-features = false }
fs-ext = { path = "crates/formats/fs-ext", default-features = false }
fs-qnx6 = { path = "crates/formats/fs-qnx6", default-features = false }
# Format-neutral Linux fscrypt (file-based encryption). Shared by every
# filesystem the kernel wires it into — ext4 today, f2fs/ubifs/ceph next —
# so it lives beside the parsers rather than inside one of them.
linux-fscrypt = { path = "crates/formats/linux-fscrypt", default-features = false }
nt-compression = { path = "crates/formats/nt-compression", default-features = false }
# nt-bitlocker is std-only (crypto stack + secrecy); no no_std variant.
nt-bitlocker = { path = "crates/formats/nt-bitlocker" }

# All external dependencies are declared here. Member crates import them
# with `<name> = { workspace = true }` — never with a version of their own.
bitflags = "2.11"
blake2 = { version = "0.10", default-features = false }
chrono = { version = "0.4", default-features = false }
clap = { version = "4", features = ["derive"] }
ewf = { version = "0.4", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
lzokay = { version = "2", default-features = false, features = ["alloc", "decompress"] }
# The CLI's `--json` reports. Only the binary serializes anything: the
# library types stay free of serde so the wire format can outlive their
# field names.
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = { version = "2", default-features = false }
time = { version = "0.3", default-features = false }
# Structured diagnostics: libraries emit events, binaries subscribe.
tracing = { version = "0.1", default-features = false, features = [
    "std",
    "attributes",
] }
# Subscriber side (binaries only); `tracing-log` also catches fuser's and ewf's `log` records.
# `json` is what `--json` puts on stderr, so a program driving the CLI reads
# one object per event instead of `level: message` prose.
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt",
    "ansi",
    "env-filter",
    "json",
    "std",
    "tracing-log",
] }
zerocopy = { version = "0.8", default-features = false }

# Windows device access
windows = "0.62"

# --- Dependencies of the vendored crates/formats/ crates ---
anyhow = "1.0"
arbitrary = { version = "1", default-features = false }
arrayvec = { version = "0.7", default-features = false }
cpufeatures = "0.3"
crc32c = { version = "0.6", default-features = false }
crc32fast = { version = "1.4", default-features = false }
derive_more = { version = "2.1", default-features = false }
divan = "0.1"
libloading = "0.9"
libfuzzer-sys = "0.4"
mutants = "0.0.4"
nt-string = { version = "0.1", default-features = false }
proptest = "1"
strum_macros = "0.28"
# NFD normalization for APFS directory-name hashing. no_std via
# default-features = false; canonical decomposition is frozen by
# Unicode's stability policy, so it matches Apple's Unicode-10 NFD.
unicode-normalization = { version = "0.1", default-features = false }
unicode-casefold = "0.2"
xxhash-rust = { version = "0.8", default-features = false, features = ["xxh64"] }
zstd = { version = "0.13", default-features = false }

# Crypto stack (ext4 fscrypt, BitLocker). The majors below are pinned and
# must be bumped in lockstep — see the individual comments.
aes = { version = "0.8", default-features = false }
ccm = { version = "0.5", default-features = false }
chacha20 = { version = "0.9", default-features = false, features = ["zeroize"] }
hkdf = { version = "0.12", default-features = false }
hmac = { version = "0.12", default-features = false }
poly1305 = { version = "0.8", default-features = false, features = ["zeroize"] }
# Pinned to 0.6 — polyval 0.7 requires the cipher 0.5 / digest 0.11
# generation, which conflicts with the project's pinned aes 0.8 / sha2
# 0.10 (see the sha2 comment below). Bump in lockstep with the sha2 /
# aes ecosystem.
polyval = { version = "0.6", default-features = false }
# Pinned to 0.10 — sha2 0.11 returns `hybrid_array::Array` from
# `digest`, which doesn't satisfy the `GenericArray`-based traits in
# the aes 0.8 / cipher 0.4 ecosystem that nt-bitlocker still depends
# on (xts-mode 0.5, ccm 0.5). Bump in lockstep with aes when xts-mode
# and ccm release against cipher 0.5.
secrecy = { version = "0.10", default-features = false }
sha2 = { version = "0.10", default-features = false }
siphasher = { version = "1.0", default-features = false }
# Pinned to 0.5 — sm4 0.6 requires Rust 1.85 and the cipher 0.5 / digest
# 0.11 generation, same conflict.
sm4 = { version = "0.5", default-features = false }
subtle = { version = "2.5", default-features = false }
xts-mode = { version = "0.5", default-features = false }
zeroize = { version = "1.7", default-features = false, features = [
    "alloc",
    "derive",
] }

# Unix mount backend (FUSE)
# `termination` also installs the handler for SIGTERM and SIGHUP, so a
# mount started by a script unmounts cleanly when the script kills it or
# the owning terminal goes away.
ctrlc = { version = "3.5", features = ["termination"] }
fuser = "0.17"
libc = "0.2"
linux-raw-sys = { version = "0.12", default-features = false }

# Windows mount backend (Dokan)
dokan = { git = "https://github.com/coconutbird/dokan-rust.git", rev = "a01841c855aefd3cbaaf042f90d16d5b4bc34692" }
widestring = "1.2"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
] }

[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }

[package]
name = "fsmnt"
description = "Read-only virtual mounting of raw/EWF/VHD/VHDX filesystem images and block devices (NTFS, FAT, exFAT, ext, APFS, Btrfs, QNX6, BitLocker) via FUSE and Dokan"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

# The library half of this package needs neither an argument parser nor a
# subscriber; both serve the `fsmnt` binary only. Cargo has no bin-only
# dependencies, so the binary is gated on a (default-on) feature instead and
# `--no-default-features` builds the library alone.
[features]
default = ["cli"]
cli = ["dep:clap", "dep:serde", "dep:serde_json", "dep:tracing-subscriber"]

[[bin]]
name = "fsmnt"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
clap = { workspace = true, optional = true }
fsmnt-core = { workspace = true }
fsmnt-device = { workspace = true }
fsmnt-drivers = { workspace = true }
fsmnt-proxy = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, optional = true }

[dev-dependencies]
crc32c = { workspace = true }
crc32fast = { workspace = true, features = ["std"] }
flate2 = { workspace = true }
fsmnt-testkit = { workspace = true, features = ["device"] }
# The fscrypt fixture's master keys are SHA-512 of fixed labels, so the
# integration test recomputes them the same way the fixture generator did.
sha2 = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(unix)'.dependencies]
fsmnt-fuse = { workspace = true }

[target.'cfg(windows)'.dependencies]
fsmnt-device-windows = { workspace = true }
fsmnt-dokan = { workspace = true }
windows-sys = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
fsmnt-device-linux = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
fsmnt-device-macos = { workspace = true }

[lints]
workspace = true

# Optimize crypto-heavy crates in dev/test builds so BitLocker key
# stretching (1M SHA-256 iterations) and sector decryption (AES-NI)
# run at near-release speed while application code stays debuggable.
[profile.dev.package.sha2]
opt-level = 2
[profile.dev.package.aes]
opt-level = 2
[profile.dev.package.cpufeatures]
opt-level = 2
[profile.dev.package.xts-mode]
opt-level = 2
[profile.dev.package.nt-bitlocker]
opt-level = 2
