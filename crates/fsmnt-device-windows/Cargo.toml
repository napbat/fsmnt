[package]
name = "fsmnt-device-windows"
version.workspace = true
edition.workspace = true

# All dependencies are Windows-only: on other targets this crate compiles
# to an empty library so workspace-wide builds work everywhere.
[target.'cfg(windows)'.dependencies]
fsmnt-device = { workspace = true }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }

[lints]
workspace = true
