[package]
name = "fsmnt-proxy"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# `tracing-subscriber` serves the `fsmnt-proxy-server` binary only; Cargo has
# no bin-only dependencies, so the binary is gated on a (default-on) feature
# instead and a consumer of the client library alone can turn it off.
[features]
default = ["server"]
server = ["dep:tracing-subscriber"]

[[bin]]
name = "fsmnt-proxy-server"
path = "src/bin/fsmnt-proxy-server.rs"
required-features = ["server"]

[dependencies]
tracing = { workspace = true }
tracing-subscriber = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
