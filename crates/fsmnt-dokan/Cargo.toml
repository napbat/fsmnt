[package]
name = "fsmnt-dokan"
version.workspace = true
edition.workspace = true

# All dependencies are Windows-only: on other targets this crate compiles
# to an empty library so workspace-wide builds work everywhere.
[target.'cfg(windows)'.dependencies]
chrono = { workspace = true, features = ["std"] }
dokan = { workspace = true }
fsmnt-core = { workspace = true }
widestring = { workspace = true }
windows-sys = { workspace = true }

[lints]
workspace = true
