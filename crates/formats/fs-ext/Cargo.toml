[package]
name = "fs-ext"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
bitflags = { workspace = true }
crc32c = "0.6"
crc32fast = { workspace = true }
fs-common = { workspace = true, default-features = false }
thiserror = { workspace = true }
zerocopy = { workspace = true, features = ["derive"] }

aes = { workspace = true, optional = true }
chacha20 = { workspace = true, optional = true }
hkdf = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
poly1305 = { workspace = true, optional = true }
polyval = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
sm4 = { workspace = true, optional = true }
siphasher = { workspace = true, optional = true }
subtle = { workspace = true, optional = true }
xts-mode = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }

chrono = { workspace = true, default-features = false, optional = true }
time = { workspace = true, default-features = false, features = [
    "formatting", "large-dates", "macros",
], optional = true }
unicode-casefold = { version = "0.2.0", optional = true }
unicode-normalization = { version = "0.1.25", optional = true }

[dev-dependencies]
# Placeholder crate that makes `#[cfg_attr(test, mutants::skip)]`
# compile when annotating a function/expression as equivalent or
# diagnostic-only for `cargo-mutants`. See
# crates/fs-ext/docs/mutation-testing.md.
mutants = "0.0.4"

[features]
default = ["std", "fscrypt", "verity"]
std = [
    "chrono?/std",
    "crc32fast/std",
    "fs-common/std",
    "thiserror/std",
    "time?/std",
    "zerocopy/std",
]
fscrypt = [
    "dep:aes",
    "dep:chacha20",
    "dep:hkdf",
    "dep:hmac",
    "dep:poly1305",
    "dep:polyval",
    "dep:sha2",
    "dep:sm4",
    "dep:siphasher",
    "dep:subtle",
    "dep:xts-mode",
    "dep:zeroize",
]
verity = ["dep:sha2"]
chrono = ["dep:chrono"]
time = ["dep:time"]
unicode-casefold = ["std", "dep:unicode-casefold", "dep:unicode-normalization"]
