[package]
name = "fs-ext"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
bitflags = { workspace = true }
crc32c = { workspace = true }
crc32fast = { workspace = true }
fsmnt-parser-core = { workspace = true, default-features = false }
thiserror = { workspace = true }
zerocopy = { workspace = true, features = ["derive"] }

# fscrypt itself lives in `linux-fscrypt` — it is shared with every
# other filesystem the kernel wires it into. What is left here is the
# ext4 glue in src/fscrypt/, which needs `zeroize` to scrub the dirhash
# key after htree consumes it and nothing else from the crypto stack.
linux-fscrypt = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }

# fs-verity hashing (the `verity` feature), unrelated to fscrypt.
sha2 = { workspace = true, optional = true }

chrono = { workspace = true, default-features = false, optional = true }
time = { workspace = true, default-features = false, features = [
    "large-dates",
], optional = true }
unicode-casefold = { workspace = true, optional = true }
unicode-normalization = { workspace = true, optional = true }

[dev-dependencies]
# Placeholder crate that makes `#[cfg_attr(test, mutants::skip)]`
# compile when annotating a function/expression as equivalent or
# diagnostic-only for `cargo-mutants`. See
# crates/fs-ext/docs/mutation-testing.md.
fsmnt-testkit = { workspace = true }
mutants = { workspace = true }
# The fscrypt fixture keys are SHA-512 digests of fixed labels, so the
# integration suite hashes for itself. Listed here rather than relying
# on the `verity` feature to have switched the optional dep on.
sha2 = { workspace = true }

[[test]]
name = "fscrypt"
path = "tests/fscrypt/mod.rs"

[features]
default = ["fscrypt", "verity"]
std = [
    "chrono?/std",
    "crc32fast/std",
    "fsmnt-parser-core/std",
    "linux-fscrypt?/std",
    "thiserror/std",
    "time?/std",
    "zerocopy/std",
]
fscrypt = ["dep:linux-fscrypt", "dep:zeroize"]
verity = ["dep:sha2"]
chrono = ["dep:chrono"]
time = ["dep:time"]
unicode-casefold = ["dep:unicode-casefold", "dep:unicode-normalization"]

[lints]
workspace = true
