[package]
name = "nt-bitlocker"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Transparent BitLocker (FVE) volume decryption"

[dependencies]
# Pinned to 0.8 — aes 0.9 uses cipher 0.5 / hybrid-array `Array`, but
# xts-mode 0.5 and ccm 0.5 (the only stable releases) still depend on
# cipher 0.4 / `GenericArray`. The trait bounds on `Xts128<Aes128>` and
# `Ccm<Aes128, …>` cannot be satisfied with the mixed crypto-stack majors.
# Revisit once xts-mode 0.6 and ccm 0.6 stable ship.
aes = { workspace = true }
ccm = { workspace = true, features = ["alloc"] }
crc32fast = { workspace = true }
secrecy = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
xts-mode = { workspace = true }
zerocopy = { workspace = true, features = ["derive"] }
zeroize = { workspace = true }

[lints]
workspace = true
