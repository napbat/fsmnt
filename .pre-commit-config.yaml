repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy (pedantic, deny warnings)
        # Vendored parsers under crates/formats/ keep their own lint config
        # and are excluded from this gate; see AGENTS.md "Vendored crates".
        entry: >-
          cargo clippy --workspace --all-targets --all-features
          --exclude fs-common --exclude fs-ntfs --exclude fs-fat
          --exclude fs-ext --exclude fs-apfs --exclude fs-exfat
          --exclude nt-compression --exclude nt-bitlocker
          -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
      - id: max-file-lines
        name: rust files must not exceed 1000 lines
        entry: python scripts/check_max_lines.py
        language: python
        types: [rust]
        # Vendored filesystem-format parsers are exempt until refactored.
        exclude: ^crates/formats/
